<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Créditos das fotografias — Zoryon Web</title><style>body{margin:0;background:#09101d;color:#e8edf7;font:16px/1.7 system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:50px 24px}h1{font-size:36px;line-height:1.2}a{color:#72ceff}p{color:#b1bfd3}ul{padding:0;list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:20px}li{padding:20px;border:1px solid #28364e;border-radius:8px}img{width:100%;height:180px;object-fit:cover}h2{font-size:18px;margin:12px 0 4px}@media(max-width:650px){ul{grid-template-columns:1fr}}</style></head><body><main><a href="/#projetos">← Voltar ao portfólio</a><h1>Créditos das fotografias</h1><p>As imagens do conceito Serra Alta são ilustrativas e não representam imóveis disponíveis para venda. Cada galeria pode reunir fotografias de diferentes locais.</p><ul id="credits"></ul><noscript><p>Consulte também o <a href="/photos/sources.json">registro completo de fontes e licenças das imagens</a>.</p></noscript></main><script>fetch('/photos/sources.json').then(r=>r.json()).then(items=>{const list=document.getElementById('credits');items.forEach(item=>{const li=document.createElement('li'),img=document.createElement('img'),h=document.createElement('h2'),source=document.createElement('a'),license=document.createElement('a');img.src='/photos/'+item.file;img.alt='Fotografia de '+item.author;img.loading='lazy';h.textContent=item.author;source.href=item.source;source.textContent='Página da fotografia';license.href=item.licenseUrl;license.textContent=item.license;li.append(img,h,source,document.createElement('br'),license);list.append(li);});}).catch(()=>{document.getElementById('credits').textContent='As fontes estão disponíveis no registro /photos/sources.json.';});</script></body></html>
